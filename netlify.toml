# Conor Pederson Music — static site, no framework, no database.
# One lightweight prebuild script (scripts/build.mjs, plain Node, no deps)
# bakes JSON-LD + freshness dates + og:image into index.html from
# data/*.json at deploy time, so AI crawlers see it without executing JS
# (SOP-AGENTIC-SEO-WEBSITES.md §3.1/§4). Runs on every deploy, including
# every Decap CMS save (a save is a commit, a commit triggers a redeploy).
[build]
  command = "node scripts/build.mjs"
  publish = "."

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Shows/music JSON must never be cached stale — they drive the page
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Conor's admin guide. Lives on the site so it has a stable, on-brand address,
# but it's for him — keep it out of search results for his name.
[[headers]]
  for = "/guide/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Publish dir is "." so repo-root docs would otherwise be served to the public.
# admin/config.yml stays readable on purpose — Decap needs to fetch it.
# force = true is required: without it Netlify serves the real file and
# skips the rule, because a static file at that path wins by default.
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/CONOR-GUIDE.md"
  to = "/"
  status = 404
  force = true

# Same reason as the two above: the ByTomorrow gateway files are internal docs
# for agents working on this repo, and the publish dir is "." so without these
# they would be served from the artist's own domain.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/"
  status = 404
  force = true

# Quote-source records for /the-voice/ live in docs/. Internal, same reason as the
# gateway files above: the publish dir is "." so without this they would be served.
[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 404
  force = true

# data/drafts.json holds draft stand-ins that are not Conor's words. The other data
# files are the page's own content and must stay served; this one is tooling input
# for scripts/drafts.mjs and has no business being public.
[[redirects]]
  from = "/data/drafts.json"
  to = "/"
  status = 404
  force = true
