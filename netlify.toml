# Conor Pederson Music — static site, no build step
[build]
  publish = "."

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Shows/music JSON must never be cached stale — they drive the page
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Conor's admin guide. Lives on the site so it has a stable, on-brand address,
# but it's for him — keep it out of search results for his name.
[[headers]]
  for = "/guide/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
