<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Sent — Conor Pederson</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/style.css">
<!-- Google Preferred Source button (ByTomorrow standing rule, 2026-09-07).
     The script renders every <div google-add-preferred-source-btn> on the page. -->
<script async src="https://news.google.com/swg/js/v1/publisher.js"></script>
<style>
  .thanks { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem; }
  .thanks h1 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: clamp(2.5rem,8vw,5rem); line-height: 1; }
  .thanks h1 span { color: transparent; -webkit-text-stroke: 2px var(--blue); }
  .thanks p { color: var(--muted); margin: 1.2rem 0 2rem; }
</style>
</head>
<body>
<div class="noise" aria-hidden="true"></div>
<main class="thanks">
  <div>
    <h1>Request <span>Sent</span></h1>
    <p>Thanks for reaching out — Conor will get back to you soon.</p>
    <a class="btn btn--primary" href="/">Back to the site</a>
  </div>
</main>
<footer class="footer footer--slim">
  <div class="preferred-source">
    <p class="preferred-source__label mono">Get Conor's updates first in Google Search and News.</p>
    <div google-add-preferred-source-btn data-theme="dark"></div>
  </div>
</footer>
</body>
</html>
